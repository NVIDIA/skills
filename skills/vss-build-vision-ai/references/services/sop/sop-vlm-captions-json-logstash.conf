# SOP JSON → Elasticsearch Logstash pipeline for DS-SOP.
#
# WHY: the default ELK decodes Kafka topic `mdx-vlm-captions` as protobuf (RT-VLM's nv.VisionLLM);
# DS-SOP publishes flat JSON (SOP_MESSAGING_SCHEMA=JSON) -> 0 docs in Elasticsearch. This pipeline
# consumes the same topic as JSON and indexes it into mdx-vlm-captions-* with the flat field
# names the SOP Kibana dashboard expects.
#
# Defaults target the stack bridge network (kafka:29092 / elasticsearch:9200); override via
# KAFKA_BOOTSTRAP_SERVERS / VSS_ES_HOST / VSS_ES_PORT env vars on the logstash container.
#
# INSTALL: drop this file into the patched pipelines/kafka/ dir (mounts FLAT to
# /usr/share/logstash/pipelines/) and register it as its OWN pipeline.id — do NOT merge it into
# the protobuf pipeline's config dir (confs in one pipeline dir merge):
#   - pipeline.id: sop-vlm-captions-json
#     path.config: "/usr/share/logstash/pipelines/sop-vlm-captions-json-logstash.conf"
# Then reload logstash — `docker compose -f <resolved.yml> up -d --force-recreate logstash` when the
# mount SOURCE was repointed (the build-vision-ai flow, via patches/logstash.yml); a bare
# `docker restart logstash` only reloads when the file was dropped into the ALREADY-mounted dir.
# The protobuf `mdx-lvs` pipeline keeps running in parallel on a different consumer group
# (harmless in a SOP-only profile).

input {
  kafka {
    topics                   => ["mdx-vlm-captions"]
    codec                    => "json"
    group_id                 => "logstash-sop-json"
    consumer_threads         => 4
    auto_offset_reset        => "earliest"
    decorate_events          => true
    key_deserializer_class   => "org.apache.kafka.common.serialization.StringDeserializer"
    bootstrap_servers        => "${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}"
  }
}

filter {
  # Non-JSON on this topic (e.g. a stray RT-VLM protobuf message) is dropped, not indexed as garbage.
  if "_jsonparsefailure" in [tags] {
    drop {}
  }

  # @timestamp from the wall-clock pipeline timestamps (real epoch for live AND file sources).
  # Do NOT use first_timestamp + end_time — relative stream seconds, 0-based on the file path
  # -> ~1970 -> the Kibana recent-time filter hides all docs. Falls back to ingest time.
  ruby {
    code => '
      pe = event.get("pipeline_chunk_end_timestamp").to_f
      pv = event.get("pipeline_vlm_ready_timestamp").to_f
      ts = pe > 1000000000 ? pe : (pv > 1000000000 ? pv : nil)
      event.set("event_time_ms", (ts * 1000.0).to_i) unless ts.nil?
    '
  }
  if [event_time_ms] {
    date {
      match    => ["event_time_ms", "UNIX_MS"]
      target   => "@timestamp"
      timezone => "UTC"
    }
    mutate { remove_field => ["event_time_ms"] }
  }

  # checker_result arrives as a nested object; keep it but also surface a flat compliance flag
  # the dashboard can filter on. Set a real BOOLEAN via ruby — `mutate add_field` only produces
  # strings, which break Kibana boolean filters and clash with the field's type across daily
  # indices. Emit it UNCONDITIONALLY (not gated on [checker_result]) so a doc that lacks the whole
  # checker_result object lands as false, not absent. Accept boolean true, "true", or 1/"1" in case
  # the checker emits an int; missing -> nil -> "" -> false.
  ruby {
    code => '
      cc = event.get("[checker_result][cycle_completed]")
      event.set("sop_cycle_completed", cc == true || cc.to_s == "true" || cc.to_s == "1")
    '
  }

  # req_id keys the idempotent upsert (document_id in output). If a chunk lacks it, a literal
  # "%{req_id}" would collide across docs — derive a stable fallback so every doc stays unique.
  if ![req_id] or [req_id] == "" {
    fingerprint { concatenate_all_fields => true target => "req_id" method => "SHA1" }
  }
}

output {
  elasticsearch {
    hosts        => ["http://${VSS_ES_HOST:elasticsearch}:${VSS_ES_PORT:9200}"]
    index        => "mdx-vlm-captions-%{+YYYY.MM.dd}"
    # match the stock mdx-lvs pipeline: don't let Logstash install its default ECS template over
    # mdx-vlm-captions-* (it would clash with the field types the SOP Kibana dashboard expects).
    manage_template => false
    # req_id is unique per chunk (e.g. "0001-<uuid>"), guaranteed present by the fingerprint
    # fallback above -> idempotent upsert on Kafka redelivery (no literal "%{req_id}" collisions).
    document_id  => "%{req_id}"
    action       => "index"
    retry_max_interval => 10
    timeout      => 60
  }
}
