subset = ""
split = "train"

[policy.parallelism]
n_init_replicas = 1
tp_size = 1
cp_size = 1
dp_shard_size = 8
dp_replicate_size = 1
pp_size = 1
cp_rotate_method = "allgather"

[custom.train_dataset]
annotation_path = ""
media_path = ""

[custom.vision]
