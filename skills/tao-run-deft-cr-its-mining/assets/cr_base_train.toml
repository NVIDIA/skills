redis = "12800"
results_dir = ""

[train]
epoch = 1
compile = false
train_batch_per_replica = 1
output_dir = ""
optm_lr = 1e-6
optm_weight_decay = 0.01
optm_warmup_steps = 0
optm_decay_type = "cosine"
seed = 42
deterministic = true

[validation]
enable = true
freq_in_epoch = 1
batch_size = 1
dataloader_num_workers = 0
dataloader_prefetch_factor = 8
enable_dataset_cache = false

[policy]
model_name_or_path = ""
model_max_length = 32768

[logging]
logger = [ "console", "tao",]
