version: 2
# Reviewed false positives for the TAO "run on Docker" skill. These are
# documentation references to standard container infrastructure, not exploitable
# privilege escalation. Tracked in NVIDIA/nvskills-ci#67.
rules:
  - id: "PE*"
    path: "SKILL.md"
    reason: "Reviewed: documents standard NGC docker-login credential location and the secure rootless --user UID:GID mapping (getpwuid troubleshooting). Path/flag references in docs, not privilege escalation."
  - id: "PE*"
    path: "references/*"
    reason: "Reviewed: docker.sock / infra references in the skill's config-schema reference doc. Documentation, not an exploit."
  - id: "AE*"
    path: "*"
    reason: "Reviewed FP: SkillSpector 2.11.0 (SkillEvaluator 1.5.4+) introduced hard runtime budgets (MAX_WORKFLOW_SECONDS=60) that cannot be raised externally; large skills are only partially inspected and the partial read is reported as evasion. Upstream: nvcarps-ci!252. Artifacts are present, small and plain-text; nothing is hidden from analysis."
  - id: "skillspector_execution_failure"
    path: "*"
    reason: "Reviewed FP: scan aborts via the same 2.11.0 runtime budget and on reference_resolution of slash-containing prose and template paths (PASS/NO_PASS, schemas/<action>.schema.json, nvcr.io image URIs, frontmatter version strings). Not a property of the skill content. Upstream: nvcarps-ci!252."
  - id: "TM1"
    path: "SKILL.md"
    reason: "Reviewed FP (#67): declared container capability matches the skill’s documented function."
