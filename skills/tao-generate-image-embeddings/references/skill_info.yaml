network_arch: tao-generate-image-embeddings
type: data
container_image: nvcr.io/nvidia/tao/tao-toolkit:7.2.0-data-services  # versions-key: images.tao_toolkit.data_services
gpu_spec_key: null
required_credentials: [NGC_KEY]   # the pinned image is nvstaging/*, which is not public
actions:
  image_embeddings:
    command: embedding image_embeddings -e {config_path}
    config_format: yaml
    mode: config
    inputs:
      input_parquet:
        type: file
    outputs:
      output_parquet:
        type: file
    upload_excludes:
    - inputs/
