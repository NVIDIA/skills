# SkillSpector baseline — findings listed here are suppressed on future scans.
# See https://github.com/NVIDIA/SkillSpector/blob/main/docs/SUPPRESSION.md.
version: 2
rules:
  # Reviewed bootstrap findings: authorized prerequisite setup, not credential exfiltration.
  - id: "PE3"
    path: "references/bootstrap.md"
    message: "*KUBECONFIG*"
    reason: "Authorized cluster setup installs an owner-only kubeconfig and passes its path to kubectl/preflight. Contents are never printed or sent to a third party; the read-only audit remains separate from approved setup."
  - id: "PE3"
    path: "references/bootstrap.md"
    message: "*secrets.env*"
    reason: "Authorized import from the selected GitLab project uses the repository importer, which validates required values, shell-quotes assignments and atomically writes owner-only files. This is intended local credential provisioning, not theft; values are not printed or committed."
  - id: "PE3"
    path: "references/bootstrap.md"
    message: "*Access Token*"
    reason: "Documents the GitLab token scope needed to read the selected project's variables. The user supplies the token at a hidden prompt; no token value appears in the skill or shell history."
  - id: "PE3"
    path: "skill-card.md"
    message: "*KUBECONFIG*"
    reason: "The credential-type field declares the kubeconfig dependency; it neither reads a credential file nor contains credentials."
  - id: "TM2"
    path: "references/bootstrap.md"
    message: "*| sudo*"
    reason: "Reviewed fixed printf-to-sudo-tee command writes only net.ipv4.ip_forward=1 to /etc/sysctl.d/99-cdf-kubernetes.conf during approved bootstrap. It does not download or execute piped code; no user-controlled content enters the pipe."

  # SKILL.md
  - id: "PE3"
    path: "SKILL.md"
    message: "*KUBECONFIG*"
    reason: "False positive: defensive documentation instructing the agent to use the user-supplied KUBECONFIG path (never guess a path, never print it) and a non-executed quick-start handoff; no credential read/exfiltration."
  - id: "PE3"
    path: "SKILL.md"
    message: "*kubeconfig*"
    reason: "False positive: safety instructions never to print kubeconfig content and to pass only the user-supplied kubeconfig path to the read-only audit; no credential read/exfiltration."
  - id: "PE3"
    path: "SKILL.md"
    message: "*~/.kube/config*"
    reason: "False positive: instructs the agent explicitly not to fall back silently to the default ~/.kube/config path; not a credential read."
  - id: "PE3"
    path: "SKILL.md"
    message: "*secrets.env*"
    reason: "False positive: non-executed quick-start handoff naming the secrets.env file the user creates from secrets.env.example; the skill never prints or exfiltrates its contents."

  # references/readiness-model.md
  - id: "PE3"
    path: "references/readiness-model.md"
    message: "*kubeconfig*"
    reason: "False positive: describes the readiness requirement for a single user-supplied kubeconfig with a reachable API endpoint; no credential read/exfiltration."

  # scripts/preflight.py
  - id: "PE3"
    path: "scripts/preflight.py"
    message: "*kubeconfig*"
    reason: "False positive: the read-only audit passes the user-supplied kubeconfig path to kubectl --kubeconfig and inspects only the API server endpoint; kubeconfig contents are never printed, logged, or transmitted."
  - id: "PE3"
    path: "scripts/preflight.py"
    message: "*secrets.env*"
    reason: "False positive: the audit checks that secrets.env.example exists and records only whether named variables in secrets.env are non-empty (parse_env_presence returns booleans); values are never retained, printed, or transmitted."

  # BENCHMARK.md (generated by NVCARPS)
  - id: "PE3"
    path: "BENCHMARK.md"
    message: "*kubeconfig*"
    reason: "False positive: generated evaluation report whose token-usage table names the 'missing-kubeconfig' eval case; contains no credential paths or contents."

  # tests/test_preflight.py
  - id: "PE3"
    path: "tests/test_preflight.py"
    message: "*kubeconfig*"
    reason: "False positive: unit tests use temporary fixture kubeconfig paths with fake runners; no real credential access."
  - id: "PE3"
    path: "tests/test_preflight.py"
    message: "*secrets.env*"
    reason: "False positive: unit tests create temporary fixture secrets.env files to verify presence-only parsing never evaluates values; no real credential access."
fingerprints: []
