config_path: submit.yaml
gym_commit: 0aa31eb833ee469a88af5b171c52f696d6249e1d # pragma: allowlist secret -- public Gym commit SHA
deployment_owned_by: model-serving team
config_summary:
  services.policy:
    model: /checkpoint
    served_model_name: team-model
    tensor_parallel_size: 2
    extra_args: --max-model-len 65536 --max-num-seqs 128 --reasoning-parser deepseek_r1
  driver.gym_install.ref: 0aa31eb833ee469a88af5b171c52f696d6249e1d # pragma: allowlist secret -- public Gym commit SHA
  driver.policy_model: policy
  driver.policy_model_type: vllm_model
  driver.benchmarks.ifbench.run:
    config_paths:
    - benchmarks/ifbench/config.yaml
    mlflow_tracking_required: false
  resumable:
    max_retries: 2
    max_walltime: 08:00:00
  compute.cluster.walltime: 04:00:00
smoke_authorization:
  output_path: /results/team-model/ifbench-smoke
  tasks: 5
  num_repeats: 1
  one_allocation: true
score_selection:
  agent: ifbench_benchmark_simple_agent
  key:
  - agent_metrics
  - mean/reward
