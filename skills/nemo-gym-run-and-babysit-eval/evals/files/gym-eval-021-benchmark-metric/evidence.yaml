execution:
  kind: direct gym eval run
  gym_job_id: null
  output: results/indic-subset/rollouts.jsonl
  exit_code: 0
protocol:
  benchmark: indic/ifeval
  selected_tasks: 10
  num_repeats: 1
  selection: named subset decision-suite-v1, not the full benchmark
  grading_mode: binary
  requested_metric: inst_level_strict_acc
old_chat_score: 0.99
rollouts_coverage:
  expected: 10
  measured: 10
  masked: 0
  failed: 0
  missing: 0
  intentionally_omitted: 0
  complete: true
  identity_verified: true
  reconciled: true
aggregate_metrics:
- agent_ref:
    name: indic_ifeval_instruction_following_simple_agent
  agent_metrics:
    mean/reward: 0.8
    prompt_level_strict_acc: 0.8
    inst_level_strict_acc: 0.9
