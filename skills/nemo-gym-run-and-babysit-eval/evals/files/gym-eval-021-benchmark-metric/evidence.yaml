quality_summary:
  run:
    artifacts:
      healthy: true
    verdicts:
      healthy: 10
      unhealthy: 0
      unobserved: 0
benchmark_metric_definition: inst_level_strict_acc is all passed instruction checks divided by all instruction checks;
  mean/reward with binary grading is the prompt-level all-instructions pass fraction.
