  - true
- task: prompt-3
  reward: 1
  inst_level_strict_acc:
  - true
- task: prompt-4
  reward: 1
  inst_level_strict_acc:
  - true
  - true
  - true
- task: prompt-5
  reward: 1
  inst_level_strict_acc:
  - true
- task: prompt-6
  reward: 1
  inst_level_strict_acc:
  - true
  - true
- task: prompt-7
  reward: 1
  inst_level_strict_acc:
