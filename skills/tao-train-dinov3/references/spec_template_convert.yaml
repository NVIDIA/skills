# DINOv3 convert: SSL checkpoint -> timm-format backbone for cv/backbone_v2 consumers.
# This is the deliverable step: the domain-adapted EMA-teacher backbone as .safetensors.
# CPU-only; accepts a stripped student_/teacher_*.pth or a full Lightning checkpoint.
encryption_key: ''
results_dir: ''
model:
  distill:
    enable: false
    disable_masking: false
    pretrained_non_distill_pl_model_path: ''
  centering_method: sinkhorn
  backbone:
    teacher_type: vit_b
    student_type: vit_b
    num_register_tokens: 4
    drop_path_rate: 0.4
    patch_size: 16
    img_size: 256
    rope_theta: 100.0
  head:
    num_layers: 3
    hidden_dim: 2048
    bottleneck_dim: 384
  gram:
    enable: false
    w_gram: 0.0
    start_step: 0
    teacher_source: pretrained
    refresh_interval: 0
    teacher_scale: 1.0
  lora:
    enable: false
    rank: 8
    alpha: 16.0
    dropout: 0.05
    target_modules:
    - qkv
    - proj
    num_last_blocks: 0
  preservation:
    enable: false
    cls_mse_weight: 0.05
    cls_cosine_weight: 0.05
dataset:
  train_dataset:
    images_dir: ''
  batch_size: 4
  pin_memory: true
  workers: 8
  transform:
    n_global_crops: 2
    global_crops_scale:
    - 0.32
    - 1.0
    global_crops_size: 256
    n_local_crops: 8
    local_crops_scale:
    - 0.05
    - 0.32
    local_crops_size: 112
train:
  num_gpus: 1
  gpu_ids:
  - 0
  num_nodes: 1
  seed: 1234
  cudnn:
    benchmark: true
    deterministic: false
  num_epochs: 10
  checkpoint_interval: 1
  checkpoint_interval_unit: epoch
  validation_interval: 1
  resume_training_checkpoint_path: ''
  results_dir: ''
  pretrained_model_path: ''
  layerwise_decay: 1.0
  clip_grad_norm: 3.0
  num_prototypes: 131072
  precision: 16-mixed
  use_custom_attention: true
  distributed_strategy: auto
  log_every_n_steps: 1
  schedulers:
    learning_rate:
      val_base: 5.0e-05
      val_final: 1.0e-06
      warm_up_steps: 10000
    last_layer_learning_rate:
      val_base: 5.0e-05
      val_final: 1.0e-06
      warm_up_steps: 10000
      freeze_steps: 1250
    weight_decay:
      val_base: 0.04
      val_final: 0.2
    momentum:
      val_base: 0.9999
      val_final: 1.0
    teacher_temperature:
      val_base: 0.07
      val_final: 0.07
      val_start: 0.04
      warm_up_steps: 37500
  optim:
    optim: adamw
convert:
  results_dir: ''
  checkpoint: ???
  # Default output: <results_dir>/dinov3_<arch>_backbone.safetensors
  output_path: ''
  # 'teacher' (EMA, recommended deliverable) | 'student' | 'student_ema'
  source: teacher
  # Validates key + shape match against a fresh timm DINOv3 model before writing,
  # so a downstream strict load cannot fail silently. Keep true.
  validate: true
