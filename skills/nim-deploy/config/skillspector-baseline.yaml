# Reviewed false positives for nim-skills PR #5 at commit
# 3f50725bb5bacfc20cb79a512b56f6293b0ddda5, using SkillSpector 2.13.5.
# Each rule scopes one rule ID, exact skill-relative file, and matched text.
# Glob metacharacters in matched text are escaped for literal matching.
# These rules do not bind file hashes: re-review when the named files change.
# Other findings and incomplete evaluations remain active.
version: 2
rules:
- id: AS1
  path: references/hook.md
  message: ~/.claude/settings.json
  reason: >-
    Reviewed 2026-11-24: The installation table tells the user where to put their own guard
    hook. The preceding instruction explicitly forbids the skill from editing user-level settings
    and requires showing the snippet to the user.
- id: PE3
  path: references/hook.md
  message: kubeconfig
  reason: >-
    Reviewed 2026-11-24: The always-denied table lists kubeconfig and KUBECONFIG changes as
    forbidden. It documents the guard refusing changes, rather than instructing credential access.
- id: PE3
  path: scripts/guard-rules.json
  message: kubeconfig
  reason: >-
    Reviewed 2026-11-24: These deny-rule reasons prohibit changing kubeconfig or explain how
    to avoid its implicit namespace. They require explicit approved context and namespace flags,
    without reading or exporting credentials.
- id: PE3
  path: scripts/guard.py
  message: kubeconfig
  reason: >-
    Reviewed 2026-11-24: The module docstring describes kubeconfig changes among the always-blocked
    operations. It does not read or export a Kubernetes credential file.
- id: PE3
  path: tests/test_guard.py
  message: kubeconfig
  reason: >-
    Reviewed 2026-11-24: Negative guard cases pass a kubeconfig override or KUBECONFIG assignment
    as command text and assert deny. The evaluate path parses these strings without running
    kubectl or opening credentials.
- id: SC2
  path: references/hook.md
  message: curl ... \| sh
  reason: >-
    Reviewed 2026-11-24: The always-denied table lists curl piped to a shell as forbidden. This
    is a description of the guard refusal, not a download-and-execute instruction.
- id: PE4
  path: scripts/guard-rules.json
  message: /var/run/docker.sock
  reason: >-
    Reviewed 2026-11-24: The docker-sock-chmod deny rule rejects chmod or chown of the Docker
    socket. Naming the protected socket in the rejection reason does not grant access or loosen
    permissions.
- id: PE4
  path: scripts/runners/nimcli.py
  message: /var/run/docker.sock
  reason: >-
    Reviewed 2026-11-24: The nim-diag-fix deny rule rejects nim diag --fix because it could
    loosen Docker socket permissions and restart Docker. Its fix requires read-only nim diag
    without --fix.
- id: PE4
  path: tests/test_guard.py
  message: /var/run/docker.sock
  reason: >-
    Reviewed 2026-11-24: Negative guard cases pass Docker socket chmod/chown commands as text
    and assert the docker-sock-chmod deny rule. The commands are evaluated by the guard, not
    executed.
- id: SC2
  path: scripts/guard.py
  message: curl | sh
  reason: >-
    Reviewed 2026-11-24: The module docstring describes curl piped to a shell among always-blocked
    operations. It does not fetch or execute a script.
- id: TM1
  path: scripts/runners/nimcli.py
  message: chmod 666
  reason: >-
    Reviewed 2026-11-24: chmod 666 appears in the nim-diag-fix rejection reason explaining why
    nim diag --fix is denied. The guard requires read-only nim diag without --fix instead.
- id: TM1
  path: tests/test_guard.py
  message: chmod 666
  reason: >-
    Reviewed 2026-11-24: The chmod 666 command is a negative test input that must return deny
    with docker-sock-chmod. It never executes the chmod command.
