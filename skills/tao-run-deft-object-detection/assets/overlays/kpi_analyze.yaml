#
# `analytics kpi_analyze` — the settings that do not vary per run, applied over
# the spec `analytics default_specs` emits. Paths, `visualize.tag`,
# `data.kpi_sources` and `kpi.conf_threshold` are run-specific and stay as --set.
#
# `kpi.conf_threshold` is deliberately absent: it is the run's scoring threshold,
# frozen at init as config.kpi_conf_threshold, and pinning it here would override
# the recorded value on every run and make the record meaningless.
#
# The comment on each line is what TAO emits by default, so the cost of removing
# the line is visible without diffing against a container.

data.input_format: KITTI       # TAO: KITTI. Uppercase here, lowercase in
                               # `gap_analysis object_detection` in the same image.
visualize.platform: local      # TAO: local. Pinned so a loop stage cannot acquire
                               # a wandb credential dependency.

kpi.iou_threshold: 0.5         # TAO: 0.5
kpi.num_recall_points: 101     # TAO: 11. 101-point interpolation, COCO-style, rather
                               # than the 11-point VOC curve. Every reported AP moves
                               # with this, so a run scored at 11 is not comparable to
                               # one scored here.
kpi.ignore_sqwidth: 0          # TAO: 0. Score every box, including small ones. Raising
                               # it drops boxes below that square-width from scoring
                               # entirely, which flatters AP by removing the hardest
                               # detections rather than by detecting them.
kpi.filter: false              # TAO: false
kpi.is_internal: false         # TAO: false. True keeps only `person` and appends
                               # a Summary row, changing what the report means
                               # while still exiting 0.
