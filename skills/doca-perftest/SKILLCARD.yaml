description: "Use this skill when the user is running DOCA Perftest\n(doca_perftest), the RDMA benchmark that measures bandwidth,\nmessage rate and latency for RDMA verbs, point-to-point or\nacross a cluster, with an optional DOCA Verbs backend (-r dv)\nor GPUNetIO engine (--engine gpunetio). Trigger even when the\nuser does not say \"DOCA Perftest\" — implicit phrasings\ninclude \"how do I benchmark RDMA write bandwidth with DOCA\",\n\"run ib_write_bw but across 8 nodes\", \"perftest says the\ndevice is busy\", \"my latency numbers differ between client\nand server\", \"launch the server over SSH\", or \"run an\nall-to-all RDMA test from a JSON scenario\". Refuse and route\nelsewhere for DOCA install (doca-setup), DOCA Bench\n(doca-bench), and application-level throughput."

