    the test asserts cnd.tgc_tags leaves it out as no image reference. The string is parsed,
    never run.
- id: PE3
  path: tests/test_env_inspect.py
  message: kubeconfig
  reason: >-
    Reviewed 2026-11-24: Test names, docstrings, comments and assertions on the context_not_found
    texts; in the no-context case, the docstring and the fix assertion also name the KUBECONFIG
    variable that the fix asks the user about. FakeRunner or a fake kubectl script prints canned
    context names; the tests check that only config get-contexts -o name ran before the error.
    No real kubeconfig is read, and no test reads or sets the variable.
- id: YR4
