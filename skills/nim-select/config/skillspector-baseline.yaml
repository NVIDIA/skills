- id: SSRF1
  path: tests/test_security.py
  message: 169.254.169.254
  reason: >-
    Reviewed 2026-11-24: ROGUE lists targets an environment variable might point requests at,
    the cloud metadata address among them. The tests set them and assert that the scripts
    request only their built-in HTTPS endpoints; requests are stopped or stubbed, never sent.
- id: PE3
