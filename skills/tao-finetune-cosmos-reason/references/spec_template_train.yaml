train:
  resume: false
  epoch: 2
  compile: false
  train_batch_per_replica: 1
  output_dir: ''
  optm_lr: 1.0e-06
  optm_impl: foreach
  optm_weight_decay: 0.01
  optm_min_lr_factor: 0.0
  optm_grad_norm_clip: 1.0
  optm_loss_spike_rollback: 0.0
  epsilon: 1.0e-08
  optm_name: AdamW
  optm_betas:
  - 0.9
  - 0.999
  optm_warmup_epochs: 0
  optm_decay_type: linear
  async_tp_enabled: false
  master_dtype: float32
  param_dtype: bfloat16
  fsdp_reduce_dtype: float32
  fsdp_offload: false
  fsdp_reshard_after_forward: default
  sync_weight_interval: 1
  ckpt:
    enable_checkpoint: true
    save_freq_in_epoch: 1
    save_mode: sync
    max_keep: 2
    export_safetensors: true
  train_policy:
    type: sft
    mini_batch: 1
    enable_dataset_cache: false
    dataloader_num_workers: 0
    conversation_column_name: conversations
    dataset:
      name: video_supervision
      test_size: 0
  fp8:
    enable_fp8: false
    fp8_recipe: dynamic_scaling
    quant_recipe: rowwise
validation:
  enable: true
  freq_in_epoch: 1
  dataset:
    name: ''
    subset: ''
    split: train
  batch_size: 1
  dataloader_num_workers: 0
  enable_dataset_cache: false
policy:
  model_name_or_path: ''
  model_max_length: 40960
  model_gradient_checkpointing: true
  parallelism:
    n_init_replicas: 1
    tp_size: 1
    cp_size: 1
    dp_shard_size: 1
    dp_replicate_size: 1
    pp_size: 1
    cp_rotate_method: allgather
logging:
  logger:
  - console
  - tao
  project_name: cosmos-rl
  experiment_name: cosmos-rl
redis: '12800'
results_dir: ''
custom:
  train_dataset:
    annotation_path: ''
    media_path: ''
    media_root: ''
    response_mode: answer
  val_dataset:
    annotation_path: ''
    media_path: ''
    media_root: ''
    response_mode: answer
  vision:
    nframes: 8
  system_prompt: ''
custom_script: ''
