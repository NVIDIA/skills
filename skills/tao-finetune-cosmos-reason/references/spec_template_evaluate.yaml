# Dataset-neutral shape template. Do not submit directly: zero/empty semantic
# fields must be resolved by scripts/evaluation_workflow.py from a sealed
# fine-tuning plan or explicit current-run intake.
results_dir: ''
task:
  type: ''
dataset:
  annotation_path: ''
  media_dir: ''
  system_prompt: ''
model:
  model_name: ''
  dtype: ''
  max_length: 0
  tp_size: 1
  enable_lora: false
  base_model_path: ''
  config_file: ''
  export_dir: ''
  vit_checkpoint_path: ''
evaluation:
  answer_type: ''
  num_processes: 1
  skip_saved: false
  seed: 0
  limit: -1
  shard_strategy: stride
  shard_id: 0
  batch_size: 0
  barrier_timeout_seconds: 14400
  soft_accuracy:
    enabled: true
    f1_threshold: 0.8
vision:
  # evaluation_workflow.py replaces num_frames with fps for FPS-sampled
  # parents and also inherits min/max_frames, clip times, resize dimensions,
  # and min/max/total pixel bounds when recorded.
  num_frames: 0
  min_pixels: 0
  max_pixels: 0
  video_decoder: pynvvideocodec
  video_cache_size: 0
  frame_transfer: host_rgb
  process_threads: 8
  decoder_cache_size: 4
  decoder_threads: 1
  decoder_device: cuda
  dataloader_num_workers: 1
  dataloader_prefetch_factor: 2
  dataloader_multiprocessing_context: spawn
  dataloader_persistent_workers: true
generation:
  max_retries: 10
  max_tokens: 0
  temperature: 0.0
  repetition_penalty: 1.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
metrics:
  names: []
results:
  save_individual_results: true
  save_confusion_matrix: true
  save_metrics_summary: true
num_gpus: 0
