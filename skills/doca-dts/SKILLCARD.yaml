description: "Use this skill for deploying and configuring the NVIDIA DOCA\nTelemetry Service (DTS) as deployed — first deciding the deployment\nshape, then following that shape's column: (A) BlueField DPU built-in\nkubelet static pod (`/etc/kubelet.d/doca_telemetry_standalone.yaml`,\n`crictl` inspection, per-version yaml from the NGC container page),\n(B) host x86_64/aarch64 docker container from NGC (`-host` image tag,\none-shot `telemetry-init.sh` then `telemetry-run.sh`, host-namespace\nflags and config/ipc_sockets/data/log mounts), or (C) DPF `DPUService`\nbacked by the `doca-telemetry` helm chart (`configMapData.providers` /\n`general` / `fluent`, `key=value` -> `key: value` mapping, `kubectl\napply`, `dpfctl describe`, level labels via `DPUFlavorTemplate`).\nShared layer: `dts_config.ini` sampling (`update`), providers\n(`enable-provider` / `disable-provider`), exporters (Prometheus pull on\n`prometheus=`, Fluent Bit / OpenTelemetry / Prometheus Remote Write\npush, storage `output=/data`), level and device labels, HFT HTTP API.\nTrigger even without \"DTS\" — implicit forms: \"prometheus on my\nBlueField returns nothing on 9100\", \"the doca_telemetry docker\ncontainer on my host exits right after start\", \"add ethtool counters\nto the telemetry DPUService in my DPF cluster\". Refuse and route for\nDOCA install / BFB / BSP, the `doca-telemetry` and\n`doca-telemetry-exporter` library API (`doca_telemetry_exporter_*`),\ninstalling the DPF cluster itself, and Grafana / Prometheus server\nsetup or dashboard / PromQL authoring."

