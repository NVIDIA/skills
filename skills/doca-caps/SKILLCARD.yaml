  name: "doca-caps"
  artifact_id: "doca-caps"
  kind: "tool"
  version: "TBD-at-sign-time"          # NVCARPS fills from the source ref
  signature: "TBD-at-sign-time"        # NVCARPS-generated SHA + ed25519 sig
