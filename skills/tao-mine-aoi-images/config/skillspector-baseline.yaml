version: 2
# Reviewed false positives — NVIDIA/nvskills-ci#67. No content removed.
rules:
  - path: "SKILL.md"
    message: "*ydra*"
    reason: "Reviewed FP (#67): scoped/standard command in setup or eval content; not malicious."
  - path: "hooks/mining-package.sh"
    message: "*HOOK_TRANSCRIPT*"
    reason: "Reviewed FP (#67): scoped/standard command in setup or eval content; not malicious."
  - id: "AS*"
    path: "hooks/mining-package.sh"
    reason: "Reviewed (#67): references to the skill's own .claude config / report-bundle hook; output stays in user workspace."
  - id: "LP*"
    path: "hooks/mining-script-check.sh"
    reason: "Reviewed FP (#67): declared capability matches the skill's documented required function."
  - id: "PE*"
    path: "references/reference-invocation.md"
    reason: "Reviewed FP (#67): standard infra path/flag refs in docs (SSH/kubeconfig/keyring/etc-passwd/docker), not privilege escalation."
  - id: "PE*"
    path: "references/setup.md"
    reason: "Reviewed FP (#67): standard infra path/flag refs in docs (SSH/kubeconfig/keyring/etc-passwd/docker), not privilege escalation."
  - path: "hooks/mining-package.sh"
    reason: "Reviewed FP (#67): Report-bundle hook copies the session transcript into the skill's own output package in the user workspace; reviewed, not exfiltration."
  - id: "AE*"
    path: "*"
    reason: "Reviewed FP: SkillSpector 2.11.0 (SkillEvaluator 1.5.4+) introduced hard runtime budgets (MAX_WORKFLOW_SECONDS=60) that cannot be raised externally; large skills are only partially inspected and the partial read is reported as evasion. Upstream: nvcarps-ci!252. Artifacts are present, small and plain-text; nothing is hidden from analysis."
  - id: "skillspector_execution_failure"
    path: "*"
    reason: "Reviewed FP: scan aborts via the same 2.11.0 runtime budget and on reference_resolution of slash-containing prose and template paths (PASS/NO_PASS, schemas/<action>.schema.json, nvcr.io image URIs, frontmatter version strings). Not a property of the skill content. Upstream: nvcarps-ci!252."
  - id: "LP1"
    path: "scripts/filter_mined_history.py"
    reason: "Reviewed FP (#67): MCP least-privilege rule applied to a non-MCP skill. The TAO skill schema declares tooling via allowed-tools and has no permissions field, so the capability cannot be declared."
  - id: "PE5"
    path: "SKILL.md"
    reason: "Reviewed FP (#67): documented container runtime flag in a usage example; required for GPU/dataloader workloads and not a privilege escalation performed by the skill."
  - id: "TP4"
    path: "SKILL.md"
    reason: "Reviewed FP (#67): describes the skill's own documented PostToolUse reporting hook; not tool poisoning."
