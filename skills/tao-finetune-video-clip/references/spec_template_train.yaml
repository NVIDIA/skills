results_dir: /results
encryption_key: nvidia_tao
wandb:
  enable: false

model:
  type: internvideo2-clip-l14
  image_size: 224
  num_frames: 8
  canonicalize_text: false
  freeze_vision_encoder: true
  freeze_text_encoder: true
  init_logit_scale: 4.605170185988092
  init_logit_bias: 0.0
  internvideo2clip_hf_id: OpenGVLab/InternVideo2_distillation_models
  text_encoder: /model/mobileclip_blt.pt
  vision_encoder: null
  clip_head: null
  pretrained_ckpt: null
  use_flash_attn: false
  use_fused_rmsnorm: false
  use_fused_mlp: false

dataset:
  seed: 42
  pin_memory: true
  train:
    type: video_text
    video_text: &vt
      metadata: /data/train.json
      format: vadr1_chunks
      data_root: null
      split: train
      path_prefix_mapping: {}
      caption_fields: [queries, action_queries, anomaly_queries]
      caption_mode: first
      idx_mode: sample_id
      idx_field: null
      anomaly_only: false
      num_frames: ${model.num_frames}
    batch_size: 2
    num_workers: 4
  val:
    type: video_text
    video_text:
      <<: *vt
      metadata: /data/val.json
      split: val
    batch_size: 2
    num_workers: 4
  metrics:
    mode: classification
    exclude_categories: [Normal, Abnormal]
  augmentation:
    scale: [1.0, 1.0]
    color_jitter: []
    grayscale: 0.0

train:
  num_epochs: 2
  checkpoint_interval: 1
  checkpoint_interval_unit: epoch
  resume_training_checkpoint_path: null
  grad_checkpointing: false
  grad_clip_norm: null
  precision: bf16
  loss_type: internvideo2_vtc
  seed: 42
  num_nodes: 1
  num_gpus: 1
  gpu_ids: [0]
  distributed_strategy: ddp
  validation_interval: 1
  optim:
    optimizer_type: adamw
    vision_lr: 0.0004
    text_lr: 0.0004
    betas: [0.9, 0.98]
    eps: 1.0e-06
    weight_decay: 0.2
    warmup_steps: 10
    scheduler: cosine
