results_dir: /results
encryption_key: nvidia_tao
wandb:
  enable: false

model:
  type: internvideo2-clip-l14
  image_size: 224
  num_frames: 8
  canonicalize_text: false
  freeze_vision_encoder: true
  freeze_text_encoder: true
  init_logit_scale: 4.605170185988092
  init_logit_bias: 0.0
  internvideo2clip_hf_id: OpenGVLab/InternVideo2_distillation_models
  text_encoder: /model/mobileclip_blt.pt
  vision_encoder: null
  clip_head: null
  pretrained_ckpt: null
  use_flash_attn: false
  use_fused_rmsnorm: false
  use_fused_mlp: false

dataset:
  seed: 42
  pin_memory: true
  val:
    type: video_text
    video_text:
      metadata: /data/val.json
      format: vadr1_chunks
      data_root: null
      split: val
      path_prefix_mapping: {}
      caption_fields: [queries, action_queries, anomaly_queries]
      caption_mode: first
      idx_mode: sample_id
      idx_field: null
      anomaly_only: false
      num_frames: ${model.num_frames}
    batch_size: 2
    num_workers: 4
  metrics:
    mode: classification
    exclude_categories: [Normal, Abnormal]

evaluate:
  checkpoint: /results/train/video_clip_latest.pth
  batch_size: 2
  num_workers: 4
  num_gpus: 1
  gpu_ids: [0]
