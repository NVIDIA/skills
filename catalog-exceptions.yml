# Catalog exceptions — skills/ dirs allowed to exist WITHOUT a
# components.d registration. Everything else in skills/ must be declared
# by a components.d/<slug>.yml entry, listed in
# .github/scripts/manual-components.yml (manually staged, README-visible
# skills), or listed here — otherwise the hourly sync prunes it
# (see .github/scripts/prune-orphans.sh).
#
# Add an entry only with a documented reason and an owner.
exceptions:
  - dir: nvidia-skill-finder
    reason: Catalog infrastructure router skill; maintained via direct PR (no components.d upstream)
    owner: jdudash
    component: NVIDIA Skills

# Plugin exceptions — plugins/ dirs allowed to exist WITHOUT a
# components.d `plugins:` registration AND without a plugins.d/<name>.yml.
# Plugins built from plugins.d/ (e.g. nvidia-skills) are outside the plugin
# sync altogether and need no entry here. Everything else in plugins/ must
# be declared by a components.d/<slug>.yml plugins: entry or listed here —
# otherwise the hourly plugin sync prunes it
# (see .github/scripts/prune-orphan-plugins.sh).
plugin_exceptions: []
