#
# Generate and validate the catalog-wide metadata.json and skills.sh.json.
#
# Modes:
#   pull_request:     run --check; fail on drift or schema/taxonomy errors.
#   workflow_dispatch: regenerate (with AI enrichment) and open a PR if files
#                      changed; open or update a tracking issue on validation
#                      failure.
#   workflow_run:     fires after either sync succeeds on main; behaves like
#                      workflow_dispatch.

name: Generate Skill Metadata

on:
  pull_request:
    paths:
      - ".github/scripts/marketplace/**"
      - ".github/scripts/aggregate_benchmarks.py"
      - ".github/scripts/generate_versions.py"
      - ".github/scripts/versions.schema.json"
      - ".github/scripts/tests/**"
      - ".github/workflows/generate-skill-metadata.yml"
      - "components.d/**"
      # A plugin's taxonomy is rolled up from the skills it bundles, so a
      # change to `include_skills` changes metadata.json without touching any
      # skill. Without this path the drift check would not run on exactly the
      # edit that causes the drift.
      - "plugins.d/**"
      # A mirrored plugin's taxonomy is rolled up from the skills bundled
      # inside plugins/<name>/skills/, identified by their SKILL.md `name`.
      # Editing or re-syncing that tree changes metadata.json without touching
      # any catalog skill, so without this path the drift check would not run
      # on exactly the change that causes the drift. components.d/** is
      # already listed above and covers the `plugins:` registry entries.
      - "plugins/**"
      - "skills.sh.json"
      # versions.json tracks every file in a skill directory: the content
      # digest follows skill.oms.sig, and last_commit/last_modified follow any
      # change at all. Watching only BENCHMARK.md would skip the check on the
      # common case of a re-signed skill whose benchmark did not change.
      - "skills/**"
      - "benchmarks.json"
      - "versions.json"
  workflow_dispatch:
  workflow_run:
    # Both syncs, because both change what metadata.json should contain: the
    # skills sync changes the skills, and the plugin sync changes which skills
    # a plugin bundles, which changes that plugin's rolled-up taxonomy. The
    # pull_request paths above include `plugins/**`, so a plugin sync that
    # lands without a regeneration would leave every later PR failing `check`
    # until someone dispatched this workflow by hand.
    workflows:
      - "Sync Skills from Product Repos"
      - "Sync Plugins from Product Repos"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: generate-skill-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # PR mode: cheap, deterministic check. Fails on drift or invalid output.
  # ---------------------------------------------------------------------
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # generate_versions.py reads `git log` per skill directory for the
          # last_commit/last_modified fields, which a shallow clone cannot
          # answer.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: pip install --upgrade pyyaml jsonschema

      # Runs before the byte-stability check: it induces enrichment failures
      # against a stub inference API to cover the recovery and reporting paths,
      # which a healthy catalog never exercises on its own.
      - name: Test generator failure handling
        run: python3 .github/scripts/marketplace/test_generate_skill_metadata.py

      - name: Validate (no AI; checked-in files must be byte-stable)
        run: python3 .github/scripts/marketplace/generate-skill-metadata.py --check --no-ai

      - name: Validate benchmarks.json (must match BENCHMARK.md sources)
        run: python3 .github/scripts/aggregate_benchmarks.py --check

      - name: Test catalog scripts
        run: python3 -m unittest discover -s .github/scripts/tests

      - name: Validate versions.json (must match skills/*/skill.oms.sig)
        run: python3 .github/scripts/generate_versions.py --check

  # ---------------------------------------------------------------------
  # Regenerate mode: dispatch or post-sync. AI enrichment allowed.
  # ---------------------------------------------------------------------
  regenerate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: pip install --upgrade pyyaml jsonschema requests

      - name: Run generator
        id: generate
        continue-on-error: true
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          INFERENCE_API_URL: ${{ vars.INFERENCE_API_URL }}
          INFERENCE_MODEL: ${{ vars.INFERENCE_MODEL }}
        run: |
          # Without pipefail the pipeline reports tee's status, so a failing
          # generator was read as rc=0 and the failure path below never ran.
          set -o pipefail
          rc=0
          python3 .github/scripts/marketplace/generate-skill-metadata.py 2>&1 | tee /tmp/generator.log || rc=$?
          if [ "${rc}" = "0" ]; then
            python3 .github/scripts/aggregate_benchmarks.py 2>&1 | tee -a /tmp/generator.log || rc=$?
          fi
          if [ "${rc}" = "0" ]; then
            python3 .github/scripts/generate_versions.py 2>&1 | tee -a /tmp/generator.log || rc=$?
          fi
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          exit ${rc}

      # Plugin problems never fail the generator, because a nonzero exit would
      # skip the PR step below and block regeneration of the whole catalog for
      # one team's stale include_skills entry. They would therefore be visible
      # only in the run log, so they are lifted out here.
      #
      # This runs unconditionally, and must. A plugin that is skipped and then
      # recovered from the previous metadata.json produces no diff at all, so
      # gating on `changed` hid exactly the warning that says a plugin's
      # taxonomy has gone stale. The job summary always receives them; the PR
      # body and the validation issue add them when they exist.
      - name: Summarize plugin warnings
        id: pluginwarn
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let section = '';
            try {
              const warnings = JSON.parse(fs.readFileSync('/tmp/skill-warnings.json', 'utf8'));
              const items = warnings.plugins || [];
              if (items.length > 0) {
                section = [
                  '',
                  `### Plugin warnings (${items.length})`,
                  '',
                  'Each line states its own outcome: a plugin skipped, a plugin kept from the previous `metadata.json`, a plugin dropped because neither a rebuild nor its previous entry was usable, or a plugin built from a partial skill list. The skills catalog is unaffected in every case.',
                  '',
                  // Warnings carry their own backticks and can span several
                  // lines, so they are emitted as plain bullets with internal
                  // whitespace collapsed. Wrapping them in backticks broke the
                  // rendering and hid the multi-line ones entirely.
                  items.map(w => `- ${String(w).split(/\s+/).join(' ').trim()}`).join('\n'),
                ].join('\n');
                await core.summary.addRaw(section).write();
              }
            } catch (e) {
              // No warnings file is the normal case.
            }
            core.setOutput('section', section);

      # ---- Failure path: open or update a tracking issue --------------
      - name: Open or update validation issue
        if: steps.generate.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/generator.log', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trigger = context.eventName;
            const truncated = log.length > 60000 ? log.slice(0, 60000) + '\n…(truncated)' : log;
            const title = '[skill-metadata] generator validation failed';

            // Surface omitted skills prominently if the structured warnings
            // file exists (written by the generator on partial-success runs).
            let omittedSection = '';
            try {
              const warnings = JSON.parse(fs.readFileSync('/tmp/skill-warnings.json', 'utf8'));
              const items = (warnings.stale_skills || []);
              if (items.length > 0) {
                omittedSection = [
                  `### Skills that could not be regenerated (${items.length})`,
                  ``,
                  `These skills could not be enriched. Any that had a valid entry in the previous \`metadata.json\` were **emitted from it unchanged**, so the catalog has not lost them, but their metadata is now stale. Any without a usable prior entry are **absent from \`metadata.json\` and \`skills.sh.json\`**. Both are retried on the next run once the underlying issue is resolved.`,
                  ``,
                  items.map(w => `- \`${w}\``).join('\n'),
                  ``,
                ].join('\n');
              }
            } catch (_) {}

            // Plugin warnings do not set the exit code, so a run that fails
            // for a skills reason can still be carrying them. Without this
            // they appear only in the log, because the regeneration PR that
            // normally reports them is never opened on this path. Read from
            // the file rather than interpolating the pluginwarn output: the
            // warnings contain backticks, which would end the template
            // literal they were pasted into.
            let pluginSection = '';
            try {
              const warnings = JSON.parse(fs.readFileSync('/tmp/skill-warnings.json', 'utf8'));
              const items = warnings.plugins || [];
              if (items.length > 0) {
                pluginSection = [
                  `### Plugin warnings (${items.length})`,
                  ``,
                  items.map(w => `- ${String(w).split(/\s+/).join(' ').trim()}`).join('\n'),
                  ``,
                ].join('\n');
              }
            } catch (_) {}

            const body = [
              `Validation failed in workflow run: ${runUrl}`,
              ``,
              `Trigger: \`${trigger}\``,
              ``,
              `cc @jim-NVIDIA @jasonNVIDIA`,
              ``,
              omittedSection,
              pluginSection,
              `<details><summary>Full generator log</summary>`,
              ``,
              '```',
              truncated,
              '```',
              ``,
              `</details>`,
            ].join('\n');

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "[skill-metadata] generator validation failed"`,
            });
            if (search.data.total_count > 0) {
              const existing = search.data.items[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.setFailed(`Validation failed; updated issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['skill-metadata', 'automation'],
              });
              core.setFailed(`Validation failed; opened issue #${created.data.number}.`);
            }

      # ---- Success path: open a PR if generated files changed ---------
      - name: Detect changes
        if: steps.generate.outputs.exit_code == '0'
        id: changes
        run: |
          # versions.json must be listed here. It follows skill.oms.sig, so a
          # sync that only re-signs a skill moves versions.json and nothing
          # else. Omitting it would leave changed=false, skip the
          # regeneration PR, and strand a stale versions.json on main -- which
          # the check job's --check step then fails on every later PR.
          if git status --porcelain \
              .github/scripts/marketplace/metadata.json \
              skills.sh.json \
              benchmarks.json \
              versions.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create regeneration PR
        if: steps.generate.outputs.exit_code == '0' && steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/regenerate-skill-metadata
          base: main
          commit-message: |
            chore(metadata): regenerate metadata.json, skills.sh.json, benchmarks.json, and versions.json

            Generated by .github/workflows/generate-skill-metadata.yml.
          title: "chore(metadata): regenerate metadata.json, skills.sh.json, benchmarks.json, and versions.json"
          body: |
            Auto-regenerated by [generate-skill-metadata workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            - Trigger: `${{ github.event_name }}`
            - Generator log: see workflow run.
            ${{ steps.pluginwarn.outputs.section }}

            cc @jim-NVIDIA @jasonNVIDIA
          labels: |
            skill-metadata
            automation
          delete-branch: true

      - name: Close any open validation issue
        if: steps.generate.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "[skill-metadata] generator validation failed"`,
            });
            for (const item of search.data.items) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body: `Latest run succeeded: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                state: 'closed',
              });
            }
