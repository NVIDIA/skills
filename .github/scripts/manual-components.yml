# TEMPORARY — remove after Computex 2026.
#
# Manual catalog exceptions: skills staged via direct PRs to nvidia/skills
# rather than synced from a public upstream. The Physical AI team's source
# repo is private and pulling from it would risk leaking unreleased material,
# so as a compromise they raise PRs into this catalog directly. These rows
# need to survive the sync workflow's README regeneration, which otherwise
# only emits rows for components declared in components.d/.
#
# Schema differs from components.d/ — there is no repo, ref, or source path,
# and a single product may span multiple top-level catalog directories.

components:
  - name: Physical AI
    description: Physical AI skills for simulation, synthetic data generation, training, validation and deployment and more.
    catalog_dirs:
      - isaac-humanoid-cloud-control
      - isaac-cable-insertion-policy-deployment
      - isaac-cable-insertion-policy-training
      - isaac-mission-control-showcase
      - omniverse-cad-to-simready
      - omniverse-content-services
      - omniverse-realtime-viewer
      - omniverse-usd-performance-tuning
      - physical-ai-infrastructure-setup-and-resilient-scaling
      - physical-ai-neural-reconstruction
  - name: PVA SDK
    description: NVIDIA Programmable Vision Accelerator (PVA) SDK skills for environment setup, host readiness checks, operator specification, generation, build and test, and debugging.
    catalog_dirs:
      - pva-build-test
      - pva-debug
      - pva-doctor
      - pva-opgen
      - pva-setup
      - pva-spec
  # TensorRT-LLM's upstream (NVIDIA/TensorRT-LLM, .claude/skills/) is public
  # but does not run NVSkills signing yet, so a components.d entry would have
  # every skill dropped as unsigned. Staged here and signed on the catalog PR
  # until signing runs at source; then move to components.d/tensorrt-llm.yml
  # with these same catalog_dir names.
  - name: TensorRT-LLM
    description: LLM inference with TensorRT-LLM — build and test execution on local GPUs and Slurm, performance profiling and optimization, GPU kernel writing, model onboarding, serving configuration, and code contribution.
    catalog_dirs:
      - trtllm-case-executor
      - trtllm-code-contribution
      - trtllm-codebase-exploration
      - trtllm-exec-env-check
      - trtllm-exec-local-compile
      - trtllm-exec-local-docker
      - trtllm-exec-local-slurm
      - trtllm-exec-remote-slurm
      - trtllm-exec-slurm-compile
      - trtllm-flashinfer-upgrade
      - trtllm-kernel-cute-writing
      - trtllm-kernel-tileir-optimization
      - trtllm-kernel-triton-writing
      - trtllm-model-onboard-multimodal
      - trtllm-moe-develop
      - trtllm-perf-analysis
      - trtllm-perf-host-analysis
      - trtllm-perf-host-optimization
      - trtllm-perf-instability-cookbook
      - trtllm-perf-nsight-compute-analysis
      - trtllm-perf-nsight-systems
      - trtllm-perf-optimization
      - trtllm-perf-optimization-casebook
      - trtllm-perf-regression-cookbook
      - trtllm-perf-torch-cuda-graphs
      - trtllm-perf-torch-sync-free
      - trtllm-perf-workload-profiling
      - trtllm-serve-config-guide
      - trtllm-test-script-builder
      - trtllm-test-specialist
      - trtllm-visualgen-bench
      - trtllm-visualgen-lpips-golden-refresh
