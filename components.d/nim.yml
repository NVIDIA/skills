name: NIM
repo: NVIDIA/nim-skills
description: Select an NVIDIA NIM that fits your GPUs, deploy NIM LLMs with Docker, Helm or the NIM Operator, smoke-check which features work, tune runtime settings on measured evidence, and benchmark speed and accuracy.
links:
  discussions: false
skills:
  - path: skills/nim-deploy/
    catalog_dir: nim-deploy
  - path: skills/nim-smoke-check/
    catalog_dir: nim-smoke-check
  - path: skills/nim-tune/
    catalog_dir: nim-tune
  - path: skills/nim-benchmark/
    catalog_dir: nim-benchmark
  - path: skills/nim-select/
    catalog_dir: nim-select
